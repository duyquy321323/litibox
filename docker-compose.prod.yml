# ---------------------------------------------------------------
# Cấu hình PRODUCTION
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (hoặc ./start.sh prod)
# - Build image production (không hot reload, không bind mount)
# - Next.js chạy `node server.js` từ output standalone
# ---------------------------------------------------------------
services:
  backend:
    build:
      target: runtime
    environment:
      APP_ENV: production
      DEBUG: "false"

  frontend:
    build:
      target: runtime
      args:
        # NEXT_PUBLIC_* được nhúng vào bundle lúc build -> phải truyền qua build arg
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
