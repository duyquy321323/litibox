name: btl

# Chạy dev  : docker compose up -d --build                (tự merge docker-compose.override.yml)
# Chạy prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Cách nhanh nhất: ./start.sh  hoặc  ./start.sh prod

services:
  db:
    image: mysql:8.0
    container_name: btl-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-btl}
      MYSQL_USER: ${MYSQL_USER:-btl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-btlpassword}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - btl

  backend:
    build:
      context: ./backend
      target: dev
    container_name: btl-backend
    restart: unless-stopped
    env_file:
      # required: false -> vẫn chạy được khi chưa có backend/.env
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Thông tin DB luôn được truyền từ .env ở thư mục gốc để tránh lệch cấu hình
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-btl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-btlpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-btl}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - btl

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: btl-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - btl

volumes:
  mysql_data:

networks:
  btl:
    driver: bridge
